name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python ${{ matrix.python }} pytest -q
      - name: fixture is up to date
        run: |
          uv run --python ${{ matrix.python }} python tests/fixtures/make_house.py
          git diff --exit-code tests/fixtures
