[project]
name = "grenton-as-code"
version = "0.1.0"
description = "Keep a Grenton Object Manager project in git, generate the myGrenton interface, and line Home Assistant up with it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "websockets>=13"]

[project.scripts]
grenton = "grenton_as_code.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
